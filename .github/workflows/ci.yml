name: Commit CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/**'
      - '!*.md'
      - '!.gitignore'

permissions:
  contents: write
  packages: read

jobs:
  build_commit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          #- macos-13
          #- windows-2022
        abi:
          - arm64-v8a
    env:
      BUILD_ABI: ${{ matrix.abi }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/fcitx5-android/fcitx5-android.git || true
          git fetch upstream --tags

      - name: Remove non-semver local tags to avoid confusion
        run: |
          # keep tags like 0.1.2 or v0.1.2 but delete others (nightly/latest/short-sha)
          git for-each-ref --format='%(refname:strip=2)' refs/tags | while read tag; do
              # allow v1.2 or v1.2.3.4 etc: one or more dot-separated numeric segments
              # use POSIX-compatible groups for bash (no (?: ) non-capturing groups)
              if [[ ! "$tag" =~ ^v?[0-9]+(\.[0-9]+)+(-.*)?$ ]]; then
              git tag -d "$tag" || true
            fi
          done

      #- name: Regenerate symlinks pointing to submodule (Windows)
      #  if: ${{ matrix.os == 'windows-2022' }}
      #  run: |
      #    Remove-Item -Recurse app/src/main/assets/usr/share
      #    git checkout -- *

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure fixed debug.keystore exists
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already present, skipping generation"
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, OU=Android, O=Android, L=Debug, ST=Debug, C=US"
          git config user.name "CI"
          git config user.email "ci@localhost"
          git add debug.keystore
          git commit -m "chore: add fixed debug keystore"
          git push origin HEAD:main

      - name: Use fixed debug keystore for all modules
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.22.1"

      - name: Install system dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      #- name: Install system dependencies (macOS)
      #  if: ${{ matrix.os == 'macos-13' }}
      #  run: |
      #    brew install extra-cmake-modules

      #- name: Install system dependencies (Windows)
      #  if: ${{ matrix.os == 'windows-2022' }}
      #  run: |
      #    C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-ucrt-x86_64-gettext mingw-w64-ucrt-x86_64-extra-cmake-modules
      #    Add-Content $env:GITHUB_PATH "C:/msys64/ucrt64/bin"

      - name: Prepare personal build sources
        env:
          # FCITX5_RIME_REPO: https://github.com/fxliang/fcitx5-rime.git
          FCITX5_RIME_REPO: https://github.com/boomker/fcitx5-rime.git
          PREBUILT_REPO: https://github.com/boomker/f5a-prebuilt.git
          PREBUILDER_REPO: https://github.com/boomker/f5a-prebuilder.git
        run: |
          ./prepare_personal_build.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Debug APK
        run: |
          local_third_party_repository="file://${PWD}/.local-thirdparty-artifacts"
          ./gradlew \
            -PgithubPackagesRepository="$local_third_party_repository" \
            :third_party:onnxruntime-genai-android:publish
          ./gradlew clean \
            -PincludeMainlineFlavor=true \
            -PgithubPackagesRepository="$local_third_party_repository" \
            :app:assembleMainlineDebug
          ./gradlew \
            -PincludeMainlineFlavor=true \
            -PgithubPackagesRepository="$local_third_party_repository" \
            :assembleDebugPlugins
          mkdir -p app/build/outputs/apk/debug/
          mv app/build/outputs/apk/mainline/debug/*.apk app/build/outputs/apk/debug/
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}" ]
            then
              mv "plugin/${i}/build/outputs/apk/debug"/*.apk "app/build/outputs/apk/debug/" 2>/dev/null || true
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # create nightly release (tagged with short sha)
      - name: Create Nightly release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            app/build/outputs/apk/debug/*.apk
